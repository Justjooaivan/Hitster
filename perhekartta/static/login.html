<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Perhekartta" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <title>Perhekartta – kirjaudu</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1f2937; color: #fff; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
    img { width: 96px; height: 96px; margin: 0 auto; border-radius: 22px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    input, button { font-size: 17px; padding: 12px; border-radius: 10px; border: 0; }
    button { background: #3b82f6; color: #fff; font-weight: 600; }
    .error { color: #fca5a5; min-height: 1.2em; margin: 0; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <img src="/static/icon-192.png" alt="" />
    <h1>Perhekartta</h1>
    <input type="password" name="password" placeholder="Salasana" autocomplete="current-password" autofocus required />
    <button type="submit">Kirjaudu</button>
    <p class="error">{{error}}</p>
  </form>
</body>
</html>
